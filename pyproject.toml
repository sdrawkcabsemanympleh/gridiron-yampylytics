[project]
name = "gridiron-yampylytics"
version = "0.1.0"
description = "NFL and college football data analysis, scraping, and visualization toolkit"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ruff>=0.13.2",
    "mypy>=1.18.2",
    "black>=25.9.0",
    "pydantic>=2.11.9",
    "pytest>=8.0.0",
    "nflreadpy>=0.1.4",
    "requests>=2.32.5",
    "pandas>=2.3.3",
    "lxml>=6.0.2",
    "selenium>=4.38.0",
    "webdriver-manager>=4.0.2",
    "harlequin>=2.4.1",
    "duckdb>=1.4.2",
    "rich>=13.7.0",
    "numpy>=1.26.0",
    "websockets>=12.0",
    "pytest-asyncio>=0.24.0",
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "html5lib>=1.1",
    "beautifulsoup4>=4.14.3",
    "numba>=0.61",
]

[project.scripts]
# Help and information
help = "gridiron_yampylytics.scripts.help:main"
list = "gridiron_yampylytics.scripts.help:main"

# Data download and status
load-data = "gridiron_yampylytics.scripts.download_data:main"
download-fp-projections = "gridiron_yampylytics.scripts.download_fp_projections:main"
show-status = "gridiron_yampylytics.scripts.show_status:main"

# Setup workflows (download → process → create database)
setup-quick = "gridiron_yampylytics.scripts.setup:quick"
setup-analysis = "gridiron_yampylytics.scripts.setup:analysis"
setup-full = "gridiron_yampylytics.scripts.setup:full"
setup-yampy = "gridiron_yampylytics.scripts.setup:yampy"

# Data processing
clean-depth-charts = "gridiron_yampylytics.scripts.clean_depth_charts:main"
combine-gm-data = "gridiron_yampylytics.scripts.combine_gm_data:main"
generate-yamplayer-id = "gridiron_yampylytics.scripts.generate_yamplayer_id:main"
calculate-yas = "gridiron_yampylytics.scripts.calculate_yas:main"
process-data = "gridiron_yampylytics.scripts.process_data:main"

# Database creation
create-duckdb-views = "gridiron_yampylytics.scripts.create_duckdb_views:main"
create-duckdb-tables = "gridiron_yampylytics.scripts.create_duckdb_tables:main"

# Database exploration
sql = "gridiron_yampylytics.scripts.sql:main"

# FFB server management
serve-api = "gridiron_yampylytics.scripts.server:serve_api"
stop-api = "gridiron_yampylytics.scripts.server:stop_api"
serve-ui = "gridiron_yampylytics.scripts.server:serve_ui"
stop-ui = "gridiron_yampylytics.scripts.server:stop_ui"
serve = "gridiron_yampylytics.scripts.server:serve"
stop = "gridiron_yampylytics.scripts.server:stop"

[tool.uv]
package = true

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# Enable core quality rules
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes (catch bugs)
    "I",      # isort (import sorting)
    "N",      # pep8-naming
    "UP",     # pyupgrade (use modern Python syntax)
    "ANN",    # flake8-annotations (type hints everywhere)
    "B",      # flake8-bugbear (common bugs)
    "C4",     # flake8-comprehensions (comprehension quality)
    "SIM",    # flake8-simplify (code simplification)
    "RET",    # flake8-return (return statement quality)
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib (prefer pathlib)
    "TID",    # flake8-tidy-imports (catch sys.path hacks)
    "RUF",    # ruff-specific rules
]

ignore = [
    # Type annotation noise reduction
    "ANN101",  # Missing type annotation for self (removed in newer ruff)
    "ANN102",  # Missing type annotation for cls (removed in newer ruff)

    # Practical code allowances
    "S101",    # Use of assert (fine in tests)
    "B905",    # zip without explicit strict (Python 3.10+, we know what we're doing)

    # Return style - allow implicit None returns
    "RET504",  # Unnecessary assignment before return (sometimes clearer to assign)
    "RET505",  # Unnecessary else after return (sometimes more readable)

    # Allow print statements in scripts
    "T201",    # print statements (useful for scripts and debugging)
]

# Docstring settings - we want reST style
[tool.ruff.lint.pydocstyle]
convention = "numpy"  # Closest to reST style with param documentation

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
